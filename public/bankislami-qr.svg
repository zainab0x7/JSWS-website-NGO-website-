    <rect x="100" y="205" width="10" height="10" rx="2"/>
    <rect x="125" y="205" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="140" y="205" width="10" height="10" rx="2"/>
    <rect x="165" y="205" width="10" height="10" rx="2"/>
    <rect x="180" y="205" width="10" height="10" rx="2"/>
    <rect x="210" y="205" width="10" height="10" rx="2"/>
    <rect x="235" y="205" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="260" y="205" width="10" height="10" rx="2"/>
    <rect x="285" y="205" width="10" height="10" rx="2"/>
    <rect x="305" y="205" width="10" height="10" rx="2"/>

    <rect x="95" y="220" width="10" height="10" rx="2"/>
    <rect x="110" y="220" width="10" height="10" rx="2"/>
    <rect x="135" y="220" width="10" height="10" rx="2"/>
    <rect x="150" y="220" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="175" y="220" width="10" height="10" rx="2"/>
    <rect x="220" y="220" width="10" height="10" rx="2"/>
    <rect x="245" y="220" width="10" height="10" rx="2"/>
    <rect x="270" y="220" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="295" y="220" width="10" height="10" rx="2"/>

    <!-- Middle Logo Badge -->
    <rect x="170" y="225" width="60" height="60" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="200" y="252" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">JSWS</text>
    <text x="200" y="267" fill="#111827" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">BANKISLAMI</text>

    <!-- Lower Data Grid -->
    <rect x="165" y="290" width="10" height="10" rx="2"/>
    <rect x="180" y="290" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="205" y="290" width="10" height="10" rx="2"/>

    <rect x="170" y="305" width="10" height="10" rx="2"/>
    <rect x="195" y="305" width="10" height="10" rx="2"/>
    <rect x="220" y="305" width="10" height="10" rx="2" fill="#b91c1c"/>

    <rect x="165" y="320" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="185" y="320" width="10" height="10" rx="2"/>
    <rect x="205" y="320" width="10" height="10" rx="2"/>
    <rect x="225" y="320" width="10" height="10" rx="2"/>

    <rect x="170" y="335" width="10" height="10" rx="2"/>
    <rect x="190" y="335" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="210" y="335" width="10" height="10" rx="2"/>

    <rect x="290" y="335" width="10" height="10" rx="2"/>
