<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="430" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header Bar -->
  <rect x="10" y="10" width="380" height="70" rx="24" fill="url(#qrGrad)"/>
  <rect x="10" y="60" width="380" height="20" fill="url(#qrGrad)"/>
  
  <!-- Header Text -->
  <text x="200" y="42" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">OFFICIAL BANKISLAMI QR CODE</text>
  <text x="200" y="62" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">JAMILA SULTAN WELFARE SOCIETY</text>

  <!-- QR Outer Border Container -->
  <rect x="65" y="100" width="270" height="270" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Finder Pattern 1 (Top-Left) -->
  <rect x="85" y="120" width="70" height="70" rx="10" fill="#111827"/>
  <rect x="97" y="132" width="46" height="46" rx="6" fill="#ffffff"/>
  <rect x="107" y="142" width="26" height="26" rx="4" fill="#b91c1c"/>

  <!-- Finder Pattern 2 (Top-Right) -->
  <rect x="245" y="120" width="70" height="70" rx="10" fill="#111827"/>
  <rect x="257" y="132" width="46" height="46" rx="6" fill="#ffffff"/>
  <rect x="267" y="142" width="26" height="26" rx="4" fill="#b91c1c"/>

  <!-- Finder Pattern 3 (Bottom-Left) -->
  <rect x="85" y="280" width="70" height="70" rx="10" fill="#111827"/>
  <rect x="97" y="292" width="46" height="46" rx="6" fill="#ffffff"/>
  <rect x="107" y="302" width="26" height="26" rx="4" fill="#b91c1c"/>

  <!-- Alignment Pattern -->
  <rect x="255" y="290" width="30" height="30" rx="5" fill="#111827"/>
  <rect x="262" y="297" width="16" height="16" rx="3" fill="#ffffff"/>
  <rect x="267" y="302" width="6" height="6" rx="1" fill="#b91c1c"/>

  <!-- Simulated Data Modules Grid -->
  <g fill="#1f2937">
    <!-- Row 1 & 2 timing & data -->
    <rect x="170" y="120" width="10" height="10" rx="2"/>
    <rect x="190" y="120" width="10" height="10" rx="2"/>
    <rect x="210" y="120" width="10" height="10" rx="2"/>
    <rect x="160" y="135" width="10" height="10" rx="2"/>
    <rect x="180" y="135" width="10" height="10" rx="2" fill="#b91c1c"/>
    <rect x="200" y="135" width="10" height="10" rx="2"/>
    <rect x="220" y="135" width="10" height="10" rx="2"/>

    <!-- Row 3 & 4 -->
    <rect x="170" y="150" width="10" height="10" rx="2"/>
    <rect x="190" y="150" width="10" height="10" rx="2"/>
    <rect x="210" y="150" width="10" height="10" rx="2" fill="#b91c1c"/>

    <rect x="160" y="165" width="10" height="10" rx="2"/>
    <rect x="180" y="165" width="10" height="10" rx="2"/>
    <rect x="200" y="165" width="10" height="10" rx="2"/>

