  <!-- Footer Text -->
  <text x="200" y="395" fill="#374151" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scan via any Mobile Banking App</text>
  <text x="200" y="415" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">IBAN: PK62BKIP0103600357930001</text>
</svg>
